<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);min-height:100vh;background:
radial-gradient(circle at 20% -10%,#7e22ce35 0,transparent 28%),
radial-gradient(circle at 95% 10%,#2e6bff22 0,transparent 30%),
linear-gradient(180deg,#0a0711,#0c0712 55%,#09060e)}
button,input,select{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.hidden{display:none!important}.app{min-height:100vh}.desktop-side{display:none}
.shell{width:min(1180px,100%);margin:auto;padding:18px 14px 138px}
.topbar{display:flex;align-items:center;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:950;letter-spacing:-1.3px}
.brand img{width:40px;height:40px;filter:drop-shadow(0 0 10px #9d35ff88)}.brand b span{color:var(--cyan)}
.top-actions{margin-left:auto;display:flex;gap:8px}.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff26;color:#fff;background:#ffffff0b;backdrop-filter:blur(18px)}
.icon-btn:hover{background:#ffffff16}.icon{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.fill{fill:currentColor;stroke:none}
.install-btn{border:1px solid #b065ff55;background:#7f2bd433;color:#fff;border-radius:18px;padding:9px 12px}.install-btn[hidden]{display:none}
.account-btn{display:flex;align-items:center;gap:8px;border:1px solid #ffffff22;background:#ffffff0a;color:#fff;border-radius:999px;padding:4px 10px 4px 4px;max-width:160px}
.account-btn:hover{background:#ffffff14}.account-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#c72df1,#4c37e8);font-size:10px;font-weight:900;box-shadow:0 0 18px #8a32e65c}.account-avatar img{width:100%;height:100%;object-fit:cover}.account-label{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-stack{display:grid;gap:9px;margin-top:13px}.auth-provider{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border:1px solid #ffffff20;border-radius:14px;padding:12px 14px;font-weight:800;color:#fff;background:#ffffff0a}.auth-provider:hover{background:#ffffff15}.auth-provider.disabled{opacity:.45;pointer-events:none}.auth-provider .provider-mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#fff;color:#121212;font-weight:950}.auth-provider.facebook .provider-mark{background:#1877f2;color:#fff}.account-card{display:flex;align-items:center;gap:12px;background:#ffffff08;border:1px solid #ffffff12;border-radius:16px;padding:12px;margin-bottom:12px}.account-card .account-avatar{width:48px;height:48px}.account-card strong{font-size:14px}.account-card small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.sync-note{font-size:11px;color:#bfb1ca;line-height:1.5}
.page-head{padding:12px 0 8px}.page-head h1{font-size:25px;line-height:1.1;margin:0 0 5px;letter-spacing:-.8px}.page-head p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 1px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #ffffff20;background:#ffffff09;color:#d8cfe2;border-radius:999px;padding:9px 14px;font-size:12px}
.chip.active,.chip:hover{border-color:#c04bff77;color:#fff;background:linear-gradient(120deg,#c127f2,#6f2ce2);box-shadow:0 7px 22px #8e22dd38}
.hero{position:relative;overflow:hidden;border-radius:23px;min-height:180px;margin:10px 0 22px;border:1px solid #ffffff18;
background:linear-gradient(115deg,#c029e6cc,#5b24c4bb 48%,#1aa6de77),#291338;
box-shadow:0 18px 50px #0007}
.hero-media{position:absolute;inset:0 0 0 38%;opacity:.72}.hero-media img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#b020dedf 0,#8a2be2b8 38%,#16101e30 74%)}
.hero-copy{position:relative;z-index:2;padding:22px;max-width:64%}.hero-copy small{font-size:10px;letter-spacing:1.4px;font-weight:800}.hero-copy h2{font-size:28px;line-height:.98;margin:10px 0 9px;letter-spacing:-1px}.hero-copy p{font-size:12px;color:#f1def9;margin:0 0 14px;line-height:1.45}.hero-copy button{border:1px solid #ffffff77;color:#fff;background:#ffffff17;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800}
.section{margin:22px 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-title h2{font-size:18px;margin:0;letter-spacing:-.4px}.section-title button{border:0;background:none;color:#c4b8ce;font-size:11px}
.h-scroll{display:flex;gap:12px;overflow:auto;padding:2px 1px 6px;scrollbar-width:none}.h-scroll::-webkit-scrollbar{display:none}
.album-tile{flex:0 0 132px;min-width:0;cursor:pointer}.album-cover{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#241535;border:1px solid #ffffff12;position:relative;box-shadow:0 10px 24px #0006}
.album-cover img{width:100%;height:100%;object-fit:cover}.album-cover .hover-play{position:absolute;right:9px;bottom:9px;width:35px;height:35px;border:0;border-radius:50%;background:linear-gradient(145deg,#bb35ff,#6330e8);color:#fff;display:grid;place-items:center;box-shadow:0 5px 18px #5f00cba0}
.album-tile strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}.album-tile small{font-size:10px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.music-list{display:grid;gap:8px}.track{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px;border-radius:14px;border:1px solid transparent}
.track:hover{background:#ffffff08;border-color:#ffffff0e}.track img{width:52px;height:52px;object-fit:cover;border-radius:11px;background:#241535}.track-main{min-width:0}
.track-main strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-main small{font-size:10px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.track-actions{display:flex;gap:5px}.round-play,.tiny-btn{border:1px solid #ffffff20;background:#ffffff0d;color:#fff;border-radius:50%;display:grid;place-items:center}.round-play{width:39px;height:39px}.tiny-btn{width:34px;height:34px}.tiny-btn.active{color:#ff43d4;background:#d622b522;border-color:#ff40d366}
.searchbox{display:flex;align-items:center;border:1px solid #ffffff20;background:#ffffff09;border-radius:17px;overflow:hidden;margin:10px 0 14px;box-shadow:inset 0 1px #ffffff0b}
.searchbox .icon{margin-left:14px;color:#cfc5d7}.searchbox input{min-width:0;flex:1;border:0;background:none;color:#fff;padding:13px 11px;outline:0}.searchbox button{border:0;background:linear-gradient(135deg,#a32fff,#5d2ce1);color:#fff;padding:13px 15px;font-weight:800}
.genre-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.genre-card{border:1px solid #ffffff15;background:linear-gradient(145deg,#1c112c,#130d20);color:#fff;border-radius:17px;padding:14px 7px;text-align:center}
.genre-card .genre-symbol{width:42px;height:42px;margin:auto auto 8px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#8b22e7,#1438b8);box-shadow:0 8px 24px #6f25dc38;font-size:19px}.genre-card span{font-size:10px;color:#d5c7df}
.empty{border:1px dashed #554565;border-radius:18px;padding:28px 16px;text-align:center;color:#a99bb6;background:#ffffff04;font-size:13px}
.playlist-grid{display:grid;gap:10px}.playlist-card{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;background:linear-gradient(120deg,#1d132d,#15101f);border:1px solid #ffffff14;border-radius:16px;padding:9px}
.playlist-cover{width:62px;height:62px;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#9d27e7,#3222a8);display:grid;place-items:center;font-size:26px}.playlist-cover img{width:100%;height:100%;object-fit:cover}
.playlist-card strong{font-size:14px}.playlist-card small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.playlist-actions{display:flex;gap:6px}
.fab{position:fixed;right:16px;bottom:94px;width:50px;height:50px;border:0;border-radius:50%;background:linear-gradient(145deg,#d62af0,#6426ea);color:#fff;box-shadow:0 10px 35px #8c1fe575;display:grid;place-items:center;z-index:19}
.bottom-nav{position:fixed;z-index:30;left:8px;right:8px;bottom:7px;display:flex;align-items:stretch;justify-content:space-around;gap:2px;padding:8px max(4px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));border:1px solid #ffffff18;border-radius:23px;background:#0e0a18e8;backdrop-filter:blur(24px);box-shadow:0 12px 50px #000b}
.bottom-nav button{flex:1;min-width:0;border:0;background:none;color:#91889f;border-radius:15px;padding:7px 3px 6px;display:grid;place-items:center;gap:4px;font-size:9px}.bottom-nav button .icon{width:21px;height:21px}.bottom-nav button.active{color:#fff;background:linear-gradient(145deg,#a92dff,#6024dd);box-shadow:0 7px 22px #8e28f957}
.mini-player{position:fixed;z-index:28;left:12px;right:12px;bottom:83px;display:grid;grid-template-columns:54px minmax(0,1fr) auto auto;align-items:center;gap:9px;padding:8px 9px;border:1px solid #9a4fff55;border-radius:18px;background:linear-gradient(90deg,#341550ed,#23113eed);backdrop-filter:blur(24px);box-shadow:0 10px 32px #000a}
.mini-video{width:54px;height:54px;border-radius:11px;overflow:hidden;background:#000;position:relative}.mini-video #youtubeMount{width:100%;height:100%}.mini-video iframe{width:100%!important;height:100%!important;border:0}
.mini-info{min-width:0}.mini-info strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-info small{font-size:9px;color:#b6aabd;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.mini-player button{border:0;background:#ffffff0c;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.now-playing{position:fixed;z-index:50;inset:0;background:radial-gradient(circle at 50% 15%,#a850ba66,transparent 38%),linear-gradient(180deg,#7537a8,#302963 54%,#1d3166 100%);overflow:auto;padding:14px 14px max(24px,env(safe-area-inset-bottom))}
.now-playing:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#16091e22,#05101c22);pointer-events:none}.player-wrap{position:relative;z-index:1;width:min(520px,100%);margin:auto}.player-head{height:52px;display:flex;align-items:center;justify-content:space-between}.player-head span{font-size:12px;color:#f3eafa}.player-close,.player-more{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff30;color:#fff;background:#ffffff0c;display:grid;place-items:center}
.player-video{width:min(360px,84vw);margin:25px auto 34px;aspect-ratio:16/9;border-radius:25px;overflow:hidden;background:#05040a;box-shadow:0 28px 75px #0008;border:1px solid #ffffff20}
.player-video #youtubeMount{width:100%;height:100%}.player-video iframe{width:100%!important;height:100%!important;border:0}
.player-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.player-meta small{color:#ddd1e4;font-size:11px}.player-meta h2{margin:4px 0 0;font-size:25px;letter-spacing:-.8px}.player-fav{width:43px;height:43px;border:1px solid #ffffff30;border-radius:50%;background:#ffffff0d;color:#fff;display:grid;place-items:center}.player-fav.active{color:#ff57dd}
.wave{display:flex;gap:3px;height:34px;align-items:center;justify-content:center;margin:26px 0 8px;opacity:.9}.wave i{display:block;width:2px;background:#fff;border-radius:9px}
.progress-row{display:flex;align-items:center;gap:8px;color:#e8def0;font-size:10px}.seek{flex:1;accent-color:#fff}
.player-controls{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:10px;margin:25px 0 15px}.player-controls button{border:0;background:none;color:#fff;display:grid;place-items:center;height:54px;border-radius:50%}.player-controls button.main{background:#ffffff1e;border:1px solid #ffffff42;width:62px;height:62px;justify-self:center;box-shadow:0 10px 28px #0003}.player-controls button.active{color:#ff7ee8;background:#ffffff12}
.player-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.player-tools button{border:1px solid #ffffff22;background:#ffffff0b;color:#f4ebf6;border-radius:14px;padding:10px 6px;font-size:10px;display:grid;place-items:center;gap:5px}.player-tools .icon{width:19px;height:19px}
.queue-panel{margin-top:18px;border-top:1px solid #ffffff22;padding-top:15px}.queue-panel h3{font-size:14px;margin:0 0 9px}.queue-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff16}.queue-item strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-item small{font-size:9px;color:#dfd2e5}.queue-buttons{display:flex;gap:4px}.queue-buttons button{width:30px;height:30px;border:1px solid #ffffff1d;background:#ffffff0c;color:#fff;border-radius:9px}
.modal-back{position:fixed;z-index:80;inset:0;background:#000b;display:grid;place-items:end center;padding:14px}.modal{width:min(480px,100%);background:#181023;border:1px solid #ffffff20;border-radius:24px;padding:19px;box-shadow:0 24px 80px #000b}.modal h2{font-size:18px;margin:0 0 13px}.modal p{color:var(--muted);font-size:12px}.modal input,.modal select{width:100%;border:1px solid #ffffff20;background:#0d0913;color:#fff;border-radius:13px;padding:12px;margin:6px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.btn{border:1px solid #ffffff1e;border-radius:12px;background:#ffffff0b;color:#fff;padding:10px 13px}.btn.primary{border:0;background:linear-gradient(135deg,#ae30ff,#6128df);font-weight:800}
.toast{position:fixed;z-index:99;left:50%;bottom:150px;transform:translateX(-50%);max-width:88vw;background:#271638;border:1px solid #8848b7;color:#fff;padding:11px 15px;border-radius:12px;box-shadow:0 10px 40px #000b;font-size:12px;display:none}
.desktop-title{display:none}
@media(max-width:520px){.account-label{display:none}.account-btn{padding:4px}.top-actions{gap:6px}}
@media(min-width:760px){
  body{padding-left:230px}.desktop-side{display:flex;position:fixed;z-index:25;left:0;top:0;bottom:0;width:230px;background:#0b0712e8;border-right:1px solid #ffffff0e;backdrop-filter:blur(20px);padding:25px 14px;flex-direction:column}
  .desktop-side .brand{padding:0 9px 24px}.side-label{color:#756b80;font-size:9px;letter-spacing:1.8px;margin:10px 10px}.side-nav{display:grid;gap:5px}.side-nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:#968ba2;padding:12px;border-radius:14px;text-align:left}.side-nav button.active,.side-nav button:hover{color:#fff;background:linear-gradient(90deg,#7326d7,#32125f)}.side-nav .icon{width:22px}
  .shell{padding:25px 35px 112px}.topbar .brand{display:none}.desktop-title{display:block}.desktop-title strong{font-size:13px}.desktop-title small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
  .bottom-nav{display:none}.mini-player{left:auto;right:22px;width:410px;bottom:18px}.fab{bottom:24px;right:450px}.hero{min-height:230px}.hero-copy{padding:35px}.hero-copy h2{font-size:39px}.hero-copy p{font-size:13px}.album-tile{flex-basis:156px}
  .genre-grid{grid-template-columns:repeat(8,1fr)}.music-list{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}.playlist-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

</style>

<div class="app"><main class="shell">
<header class="topbar">
  <div class="brand"><img src="/icon.svg" alt=""><b>ZU<span>PLAY</span></b></div>
  <div class="desktop-title"><strong>ZUPLAY</strong><small>Vídeos e músicas sem limites</small></div>
  <div class="top-actions">
    <button id="installBtn" class="install-btn" hidden>Instalar</button>
    <button id="accountBtn" class="account-btn" type="button" aria-label="Conta">

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const icon=(id,cls='icon')=>'<svg class="'+cls+'"><use href="#i-'+id+'"/></svg>';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,f)=>{try{const v=JSON.parse(localStorage.getItem('zuplay-'+k));return v??f}catch{return f}};
let authState={ready:false,user:null,providers:{google:false,facebook:false}},cloudSyncTimer=null,cloudSyncBusy=false;
function persistLocal(k,v){localStorage.setItem('zuplay-'+k,JSON.stringify(v))}
function save(k,v){persistLocal(k,v);scheduleCloudSync()}
function migratePlaylists(raw){const out={};for(const [name,val] of Object.entries(raw||{})){out[name]=Array.isArray(val)?{name,items:val}:{name,...val,items:Array.isArray(val?.items)?val.items:[]}}return out}
const state={
  page:'home',player:null,current:null,queue:[],results:[],recommendations:[],trending:[],allItems:[],
  favorites:load('favorites',[]),history:load('history',[]),playlists:migratePlaylists(load('playlists',{})),
  taste:load('taste',{}),shuffle:load('shuffle',false),repeat:load('repeat','off'),playing:false,
  timer:null,homeLoaded:false
};
function cloudPayload(){return {favorites:state.favorites,history:state.history,playlists:state.playlists,taste:state.taste,settings:{shuffle:state.shuffle,repeat:state.repeat}}}
function scheduleCloudSync(){if(!authState.ready||!authState.user)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(syncCloud,900)}
async function syncCloud(){if(!authState.user||cloudSyncBusy)return;cloudSyncBusy=true;try{const r=await fetch('/api/user-data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cloudPayload())});if(r.status===401){authState.user=null;updateAccountUi()}else if(!r.ok)throw Error('Falha ao sincronizar')}catch(e){console.info('[ZUPLAY sync]',e.message)}finally{cloudSyncBusy=false}}
function mergePlaylists(remote,local){const out=migratePlaylists(remote||{});for(const [name,p] of Object.entries(migratePlaylists(local||{}))){if(!out[name])out[name]=p;else out[name].items=uniq([...(out[name].items||[]),...(p.items||[])])}return out}
function applyCloudData(data){
 if(!data)return;
 state.favorites=uniq([...(data.favorites||[]),...state.favorites]);
 state.history=uniq([...(data.history||[]),...state.history]).slice(0,120);
 state.playlists=mergePlaylists(data.playlists,state.playlists);
 const remoteTaste=data.taste||{};for(const [k,v] of Object.entries(remoteTaste))state.taste[k]=Math.max(Number(state.taste[k]||0),Number(v||0));
 if(data.settings){if(typeof data.settings.shuffle==='boolean')state.shuffle=data.settings.shuffle;if(['off','all','one'].includes(data.settings.repeat))state.repeat=data.settings.repeat}
 persistLocal('favorites',state.favorites);persistLocal('history',state.history);persistLocal('playlists',state.playlists);persistLocal('taste',state.taste);persistLocal('shuffle',state.shuffle);persistLocal('repeat',state.repeat)
}
function initials(name){return String(name||'ZU').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'ZU'}
function updateAccountUi(){
 const avatar=$('#accountAvatar'),label=$('#accountLabel');if(!avatar||!label)return;
 if(authState.user){label.textContent=authState.user.name||'Minha conta';avatar.innerHTML=authState.user.avatar?'<img src="'+esc(authState.user.avatar)+'" alt="">':esc(initials(authState.user.name))}
 else{label.textContent='Entrar';avatar.textContent='ZU'}
}
async function initAuth(){
 try{
  const [me,providers]=await Promise.all([fetch('/api/me').then(r=>r.json()),fetch('/api/auth/providers').then(r=>r.json()).catch(()=>({}))]);
  authState.providers={google:Boolean(providers.google),facebook:Boolean(providers.facebook)};
  if(me.authenticated&&me.user){authState.user=me.user;applyCloudData(me.data);authState.ready=true;updateAccountUi();renderPage();await syncCloud();const u=new URL(location.href);if(u.searchParams.has('login')){u.searchParams.delete('login');history.replaceState({},'',u.pathname+u.search)}}
  else{authState.ready=true;updateAccountUi();if(new URLSearchParams(location.search).get('login')==='error')toast('Não foi possível concluir o login.')}
 }catch(e){authState.ready=true;console.info('[Auth]',e.message)}
}
function accountModal(){
 if(authState.user){
  modal('Minha conta','<div class="account-card"><span class="account-avatar">'+(authState.user.avatar?'<img src="'+esc(authState.user.avatar)+'" alt="">':esc(initials(authState.user.name)))+'</span><div><strong>'+esc(authState.user.name||'Usuário ZUPLAY')+'</strong><small>'+esc(authState.user.email||authState.user.provider||'Conta conectada')+'</small></div></div><p class="sync-note">Favoritos, playlists, histórico e preferências são sincronizados com sua conta.</p>','<button class="btn primary" id="logoutBtn">Sair da conta</button>');
  setTimeout(()=>{$('#logoutBtn').onclick=logoutAccount},0);return;
 }
 const g=authState.providers.google,f=authState.providers.facebook;
 modal('Entrar no ZUPLAY','<p class="sync-note">Entre para salvar favoritos, playlists, histórico e preferências no MongoDB e usar em outros aparelhos.</p><div class="auth-stack"><a class="auth-provider '+(g?'':'disabled')+'" href="/auth/google"><span class="provider-mark">G</span>Continuar com Google</a><a class="auth-provider facebook '+(f?'':'disabled')+'" href="/auth/facebook"><span class="provider-mark">f</span>Continuar com Facebook</a></div>'+((!g&&!f)?'<p class="sync-note">Os provedores de login ainda precisam ser configurados no servidor.</p>':'') ,'');
}
async function logoutAccount(){try{await fetch('/api/logout',{method:'POST'});authState.user=null;closeModal();updateAccountUi();toast('Você saiu da conta. Os dados continuam neste aparelho.')}catch{toast('Não foi possível sair agora')}}
persistLocal('playlists',state.playlists);
const genreTerms={
 sertanejo:['sertanejo','modão','modao','agro','sofrência','sofrencia','ana castela','henrique e juliano','jorge e mateus','gusttavo','marília','marilia','luan santana'],
 funk:['funk','mc ','mandelão','mandelao','automotivo','dj arana'],
 pagode:['pagode','samba','thiaguinho','sorriso maroto','menos é mais'],
 gospel:['gospel','louvor','adoração','adoracao','gabriela rocha','isaias saad'],
 forro:['forró','forro','piseiro','joão gomes','joao gomes','zé vaqueiro'],
 rock:['rock','metal','nirvana','queen','guns n'],
 pop:['pop','taylor swift','dua lipa','billie eilish','bruno mars','the weeknd'],
 eletronica:['eletrônica','eletronica','edm','house','alok'],
 rap:['rap','trap','hip hop','matuê','matue','racionais']
};
const discovery={
 sertanejo:['sertanejo mais tocadas 2026','sertanejo universitário sucessos'],
 funk:['funk brasileiro hits 2026','funk mais tocadas'],
 pagode:['pagode mais tocadas 2026','pagode sucessos'],
 gospel:['gospel louvores mais ouvidos','gospel sucessos'],
 forro:['forró piseiro sucessos','forró mais tocadas'],
 rock:['rock sucessos mais tocados','rock clássico hits'],
 pop:['pop hits 2026','pop internacional sucessos'],
 eletronica:['eletrônica hits 2026','edm hits'],
 rap:['rap trap brasil sucessos','rap nacional mais tocadas'],
 outros:['músicas mais tocadas brasil 2026','hits do momento brasil 2026','sertanejo mais tocadas','pagode sucessos','pop hits 2026','funk brasileiro hits']
};
function toast(msg){const el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.style.display='none',2800)}
function fmt(sec){if(!Number.isFinite(sec)||sec<0)return'0:00';sec=Math.floor(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function genreOf(v){const t=(v?.title||'').toLocaleLowerCase('pt-BR');return Object.keys(genreTerms).find(g=>genreTerms[g].some(k=>t.includes(k)))||'outros'}
function trackTaste(v){const g=genreOf(v);state.taste[g]=(state.taste[g]||0)+1;save('taste',state.taste)}
function topGenres(){return Object.entries(state.taste).filter(([g,n])=>g!=='outros'&&n>0).sort((a,b)=>b[1]-a[1]).map(([g])=>g)}
function discoveryTerm(){const tops=topGenres();const g=tops.length&&Math.random()<.78?tops[Math.floor(Math.random()*Math.min(2,tops.length))]:'outros';const arr=discovery[g]||discovery.outros;return arr[Math.floor(Math.random()*arr.length)]}
async function apiSearch(q){const r=await fetch('/api/search?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw Error(data.error||'Falha na busca');return data.items||[]}
function uniq(items){const seen=new Set;return items.filter(x=>x?.id&&!seen.has(x.id)&&(seen.add(x.id),true))}
function getVideo(id){return uniq([...state.results,...state.recommendations,...state.trending,...state.allItems,...state.favorites,...state.history,...state.queue,...Object.values(state.playlists).flatMap(p=>p.items),...(state.current?[state.current]:[])]).find(x=>x.id===id)}
function isFav(id){return state.favorites.some(x=>x.id===id)}
function fav(v){if(!v)return;state.favorites=isFav(v.id)?state.favorites.filter(x=>x.id!==v.id):[v,...state.favorites];save('favorites',state.favorites);updatePlayerMeta();renderPage();toast(isFav(v.id)?'Adicionado aos favoritos':'Removido dos favoritos')}
function trackHtml(v,index=''){return '<article class="track"><img src="'+esc(v.thumbnail||('https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg'))+'" alt="" loading="lazy"><div class="track-main"><strong>'+esc(v.title)+'</strong><small>'+esc(v.channel||'YouTube')+(index!==''?' • '+index:'')+'</small></div><div class="track-actions"><button class="tiny-btn '+(isFav(v.id)?'active':'')+'" data-fav="'+esc(v.id)+'" aria-label="Favoritar">'+icon('heart')+'</button><button class="round-play" data-play="'+esc(v.id)+'" aria-label="Reproduzir">'+icon('play')+'</button></div></article>'}
function tileHtml(v){return '<article class="album-tile" data-play="'+esc(v.id)+'"><div class="album-cover"><img src="'+esc(v.thumbnail||('https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'))+'" alt="" loading="lazy"><button class="hover-play" aria-label="Reproduzir">'+icon('play')+'</button></div><strong>'+esc(v.title)+'</strong><small>'+esc(v.channel||'YouTube')+'</small></article>'}
function genreButtons(active='Tudo'){const names=['Tudo','Sertanejo','Funk','Pagode','Pop','Rock','Gospel'];return '<div class="chips">'+names.map(n=>'<button class="chip '+(active===n?'active':'')+'" data-genre="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>'}
function heading(title,action='',attr=''){return '<div class="section-title"><h2>'+esc(title)+'</h2>'+(action?'<button '+attr+'>'+esc(action)+' ›</button>':'')+'</div>'}
function continueItems(){return state.history.slice(0,8)}
async function ensureHome(){
 if(state.homeLoaded)return;
 state.homeLoaded=true;
 try{
   const [personal,popular]=await Promise.all([apiSearch(discoveryTerm()),apiSearch('músicas mais tocadas brasil 2026')]);
   state.recommendations=uniq(personal).slice(0,18);state.trending=uniq(popular).slice(0,18);state.allItems=uniq([...state.recommendations,...state.trending]);
 }catch(e){state.homeLoaded=false;toast('Não foi possível atualizar as sugestões agora')}
 if(state.page==='home'||state.page==='explore'||state.page==='all')renderPage()
}
function heroItem(){return state.recommendations[0]||state.trending[0]||state.history[0]}
function renderHome(){
 const hero=heroItem();const cont=continueItems();const personalized=state.recommendations.slice(0,8);const popular=state.trending.slice(0,8);
 $('#view').innerHTML='<div class="page-head"><h1>Olá 👋</h1><p>Que tal descobrir uma nova música hoje?</p></div>'+genreButtons()+
 (hero?'<section class="hero"><div class="hero-media"><img src="'+esc(hero.thumbnail)+'" alt=""></div><div class="hero-copy"><small>FEITO PARA VOCÊ</small><h2>Sinta<br>a música.</h2><p>Descubra novos artistas e deixe o ZUPLAY aprender o seu gosto.</p><button data-play="'+esc(hero.id)+'">Começar a ouvir</button></div></section>':'')+
 (cont.length?'<section class="section">'+heading('Continue ouvindo','Ver histórico','data-page="history"')+'<div class="h-scroll">'+cont.map(tileHtml).join('')+'</div></section>':'')+
 '<section class="section">'+heading(topGenres().length?'Mais tocadas para você':'Descubra sua próxima favorita','Ver tudo','data-page="all"')+
 (personalized.length?'<div class="music-list">'+personalized.map((v,i)=>trackHtml(v,i+1)).join('')+'</div>':'<div class="empty">Preparando sugestões para você...</div>')+'</section>'+
 '<section class="section">'+heading('Em alta no ZUPLAY','Ver tudo','data-page="all"')+(popular.length?'<div class="h-scroll">'+popular.map(tileHtml).join('')+'</div>':'<div class="empty">Carregando músicas populares...</div>')+'</section>';
}
function renderExplore(){
 $('#view').innerHTML='<div class="page-head"><h1>Explorar</h1><p>Descubra novos artistas, estilos e tendências.</p></div><form id="searchForm" class="searchbox"><svg class="icon"><use href="#i-search"/></svg><input id="query" placeholder="Pesquisar músicas, artistas e vídeos..." autocomplete="off" required><button>Buscar</button></form>'+
 '<div class="genre-grid">'+[['Sertanejo','♬'],['Funk','◉'],['Pagode','♪'],['Pop','✦'],['Rock','⚡'],['Gospel','✧'],['Forró','♫'],['Eletrônica','⌁']].map(([n,s])=>'<button class="genre-card" data-genre="'+n+'"><div class="genre-symbol">'+s+'</div><span>'+n+'</span></button>').join('')+'</div>'+
 '<section class="section">'+heading(state.results.length?'Resultados da busca':'Em alta no ZUPLAY')+'<div class="music-list">'+(state.results.length?state.results:state.trending).slice(0,18).map((v,i)=>trackHtml(v,i+1)).join('')+'</div></section>';
 setTimeout(()=>{const f=$('#searchForm');if(f)f.onsubmit=e=>{e.preventDefault();runSearch($('#query').value.trim())}},0);
}
function renderAll(){
 const all=uniq([...state.recommendations,...state.trending,...state.results]);
 $('#view').innerHTML='<div class="page-head"><h1>Todos os vídeos</h1><p>Suas descobertas reunidas em um só lugar.</p></div><form id="searchForm" class="searchbox"><svg class="icon"><use href="#i-search"/></svg><input id="query" placeholder="Pesquisar no ZUPLAY..." required><button>Buscar</button></form>'+genreButtons()+
 '<section class="section">'+heading('Músicas e vídeos')+(all.length?'<div class="music-list">'+all.map((v,i)=>trackHtml(v,i+1)).join('')+'</div>':'<div class="empty">Busque uma música ou aguarde as recomendações.</div>')+'</section>';
 setTimeout(()=>{const f=$('#searchForm');if(f)f.onsubmit=e=>{e.preventDefault();runSearch($('#query').value.trim())}},0);
}
function renderFavorites(){
 $('#view').innerHTML='<div class="page-head"><h1>Meus Favoritos</h1><p>Suas músicas e vídeos preferidos.</p></div>'+
 (state.favorites.length?'<div class="music-list">'+state.favorites.map((v,i)=>trackHtml(v,i+1)).join('')+'</div>':'<div class="empty">Você ainda não favoritou nenhuma música.</div>');
}
function playlistCover(p){const img=p.items[0]?.thumbnail;return img?'<img src="'+esc(img)+'" alt="">':icon('list')}
function renderPlaylists(){
 const ps=Object.values(state.playlists);
 $('#view').innerHTML='<div class="page-head"><h1>Minhas Playlists</h1><p>Organize suas músicas favoritas.</p></div>'+
 (ps.length?'<div class="playlist-grid">'+ps.map(p=>'<article class="playlist-card"><div class="playlist-cover">'+playlistCover(p)+'</div><div><strong>'+esc(p.name)+'</strong><small>'+p.items.length+' música'+(p.items.length===1?'':'s')+'</small></div><div class="playlist-actions"><button class="round-play" data-openlist="'+esc(p.name)+'">'+icon('play')+'</button><button class="tiny-btn" data-playlist-menu="'+esc(p.name)+'">'+icon('more')+'</button></div></article>').join('')+'</div>':'<div class="empty">Crie sua primeira playlist e organize suas músicas.</div>')+
 '<button class="fab" id="newPlaylist" aria-label="Nova playlist">'+icon('plus')+'</button>';
 setTimeout(()=>{const b=$('#newPlaylist');if(b)b.onclick=()=>createPlaylist()},0);
}
function renderHistory(){
 $('#view').innerHTML='<div class="page-head"><h1>Histórico</h1><p>Continue de onde você parou.</p></div>'+
 (state.history.length?'<div class="music-list">'+state.history.map((v,i)=>trackHtml(v,i+1)).join('')+'</div>':'<div class="empty">Seu histórico ainda está vazio.</div>');
}
function renderPage(){
 $$('#view [data-temp]').forEach(x=>x.remove());
 if(state.page==='home')renderHome();else if(state.page==='explore')renderExplore();else if(state.page==='all')renderAll();else if(state.page==='favorites')renderFavorites();else if(state.page==='playlists')renderPlaylists();else if(state.page==='history')renderHistory();
 $$('.bottom-nav [data-page],.side-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
}
function page(p){state.page=p;renderPage();if((p==='home'||p==='explore'||p==='all')&&!state.homeLoaded)ensureHome();window.scrollTo({top:0,behavior:'smooth'})}
async function runSearch(q){
 if(!q)return;state.page='explore';$('#view').innerHTML='<div class="empty">Buscando “'+esc(q)+'”...</div>';
 try{state.results=await apiSearch(q);state.allItems=uniq([...state.results,...state.allItems]);renderExplore()}catch(e){$('#view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
async function searchGenre(name){
 if(name==='Tudo'){state.results=[];page('home');return}
 state.page='explore';$('#view').innerHTML='<div class="empty">Buscando '+esc(name)+'...</div>';
 try{state.results=await apiSearch(name+' músicas mais tocadas 2026');renderExplore()}catch(e){toast(e.message);renderExplore()}
}
function buildQueue(v,source){
 let arr=source&&source.length?source:uniq([...state.results,...state.recommendations,...state.trending]);
 const i=arr.findIndex(x=>x.id===v.id);if(i>=0){arr=[...arr.slice(i+1),...arr.slice(0,i)].filter(x=>x.id!==v.id);if(state.shuffle)arr=arr.sort(()=>Math.random()-.5);state.queue=arr.slice(0,40)}
}
function play(v,source){
 if(!v)return;state.current=v;trackTaste(v);state.history=[v,...state.history.filter(x=>x.id!==v.id)].slice(0,120);save('history',state.history);
 if(!state.queue.length)buildQueue(v,source);updatePlayerMeta();showPlayer();
 if(state.player?.loadVideoById)state.player.loadVideoById(v.id);else if(window.YT?.Player)createPlayer(v.id);else{window.pendingVideoId=v.id;toast('Preparando o player...')}
 renderQueue();updateMediaSession(v)
}
function next(){
 if(state.repeat==='one'&&state.current){state.player?.seekTo(0,true);state.player?.playVideo();return}
 let v=state.queue.shift();
 if(!v&&state.repeat==='all'&&state.current){buildQueue(state.current);v=state.queue.shift()}
 if(v)play(v);else toast('Fim da fila');
 renderQueue()
}
function previous(){
 const i=state.history.findIndex(x=>x.id===state.current?.id);const v=state.history[i+1];if(v){if(state.current)state.queue.unshift(state.current);play(v)}else toast('Nenhuma música anterior')
}
function togglePlayback(){if(!state.player)return;state.player.getPlayerState()===YT.PlayerState.PLAYING?state.player.pauseVideo():state.player.playVideo()}
function createPlayer(id){
 state.player=new YT.Player('youtubeFrame',{videoId:id,playerVars:{playsinline:1,rel:0,autoplay:1,origin:location.origin},events:{
   onReady:e=>{e.target.playVideo();startProgress()},
   onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next();if(e.data===YT.PlayerState.PLAYING)syncPlay(true);if(e.data===YT.PlayerState.PAUSED)syncPlay(false)},
   onError:e=>{toast('Vídeo indisponível. Pulando...');setTimeout(next,900)}
 }})
}
window.onYouTubeIframeAPIReady=()=>{if(window.pendingVideoId){createPlayer(window.pendingVideoId);window.pendingVideoId=null}}
function syncPlay(on){
 state.playing=on;const use=on?'pause':'play';
 ['#mainToggle','#miniToggle'].forEach(s=>{const b=$(s);if(b)b.innerHTML=icon(use)});
 try{if('mediaSession'in navigator)navigator.mediaSession.playbackState=on?'playing':'paused'}catch{}
}
function updateMediaSession(v){
 if(!('mediaSession'in navigator)||!v)return;
 try{
 navigator.mediaSession.metadata=new MediaMetadata({title:v.title,artist:v.channel||'YouTube',album:'ZUPLAY',artwork:v.thumbnail?[{src:v.thumbnail,sizes:'320x180'}]:[]});
 navigator.mediaSession.setActionHandler('play',()=>state.player?.playVideo());navigator.mediaSession.setActionHandler('pause',()=>state.player?.pauseVideo());
 navigator.mediaSession.setActionHandler('nexttrack',next);navigator.mediaSession.setActionHandler('previoustrack',previous)
 }catch{}
}
function updatePlayerMeta(){
 const v=state.current;if(!v)return;$('#playingTitle').textContent=v.title;$('#playingChannel').textContent=v.channel||'YouTube';$('#miniTitle').textContent=v.title;$('#miniChannel').textContent=v.channel||'YouTube';
 $('#favoriteCurrent').classList.toggle('active',isFav(v.id));$('#shuffleBtn').classList.toggle('active',state.shuffle);$('#repeatBtn').classList.toggle('active',state.repeat!=='off')
}
function moveYoutube(target){const m=$('#youtubeMount');if(target&&m.parentElement!==target)target.appendChild(m)}
function showPlayer(){moveYoutube($('#playerVideo'));$('#nowPlaying').classList.remove('hidden');$('#miniPlayer').classList.add('hidden');document.body.style.overflow='hidden'}
function minimizePlayer(){moveYoutube($('#miniVideo'));$('#nowPlaying').classList.add('hidden');$('#miniPlayer').classList.remove('hidden');document.body.style.overflow=''}
function startProgress(){clearInterval(window.__progress);window.__progress=setInterval(()=>{if(!state.player?.getDuration)return;const d=state.player.getDuration()||0,c=state.player.getCurrentTime()||0;$('#currentTime').textContent=fmt(c);$('#duration').textContent=fmt(d);if(!$('#seek').matches(':active'))$('#seek').value=d?Math.round(c/d*1000):0},650)}
function renderQueue(){
 const q=$('#queueList');if(!q)return;q.innerHTML=state.queue.length?state.queue.map((v,i)=>'<div class="queue-item"><div><strong>'+esc(v.title)+'</strong><small>'+esc(v.channel||'YouTube')+'</small></div><div class="queue-buttons"><button data-qup="'+i+'">'+icon('up')+'</button><button data-qdown="'+i+'">'+icon('down')+'</button><button data-qremove="'+i+'">'+icon('trash')+'</button></div></div>').join(''):'<div class="empty">A fila está vazia.</div>'
}
function modal(title,body,actions){$('#modalHost').innerHTML='<div class="modal-back"><div class="modal"><h2>'+esc(title)+'</h2>'+body+'<div class="modal-actions"><button class="btn" data-close-modal>Cancelar</button>'+actions+'</div></div></div>'}
function closeModal(){$('#modalHost').innerHTML=''}
function createPlaylist(){modal('Nova playlist','<input id="playlistName" maxlength="40" placeholder="Nome da playlist">','<button class="btn primary" id="confirmPlaylist">Criar</button>');setTimeout(()=>{$('#confirmPlaylist').onclick=()=>{const n=$('#playlistName').value.trim();if(!n)return toast('Digite um nome');if(state.playlists[n])return toast('Essa playlist já existe');state.playlists[n]={name:n,items:[]};save('playlists',state.playlists);closeModal();renderPlaylists()}},0)}
function addToPlaylist(v){
 if(!v)return;const names=Object.keys(state.playlists);if(!names.length){createPlaylist();toast('Crie uma playlist primeiro');return}
 modal('Adicionar à playlist','<select id="playlistSelect">'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select>','<button class="btn primary" id="confirmAdd">Adicionar</button>');
 setTimeout(()=>{$('#confirmAdd').onclick=()=>{const n=$('#playlistSelect').value,p=state.playlists[n];if(p&&!p.items.some(x=>x.id===v.id))p.items.push(v);save('playlists',state.playlists);closeModal();toast('Adicionado à playlist '+n)}},0)
}
function openPlaylist(name){
 const p=state.playlists[name];if(!p)return;
 $('#view').innerHTML='<div class="page-head"><h1>'+esc(name)+'</h1><p>'+p.items.length+' músicas</p></div>'+
 '<div class="chips"><button class="chip active" data-play-playlist="'+esc(name)+'">▶ Reproduzir tudo</button><button class="chip" data-rename-playlist="'+esc(name)+'">Renomear</button></div>'+
 (p.items.length?'<div class="music-list">'+p.items.map((v,i)=>trackHtml(v,i+1)).join('')+'</div>':'<div class="empty">Esta playlist ainda está vazia.</div>')
}
function playlistMenu(name){modal(name,'<p>Edite ou exclua esta playlist.</p>','<button class="btn" id="renamePL">Renomear</button><button class="btn primary" id="deletePL">Excluir</button>');setTimeout(()=>{$('#renamePL').onclick=()=>renamePlaylist(name);$('#deletePL').onclick=()=>{delete state.playlists[name];save('playlists',state.playlists);closeModal();renderPlaylists()}},0)}
function renamePlaylist(name){closeModal();modal('Renomear playlist','<input id="newPlaylistName" maxlength="40" value="'+esc(name)+'">','<button class="btn primary" id="saveRename">Salvar</button>');setTimeout(()=>{$('#saveRename').onclick=()=>{const n=$('#newPlaylistName').value.trim();if(!n||n===name)return closeModal();if(state.playlists[n])return toast('Já existe uma playlist com esse nome');state.playlists[n]={...state.playlists[name],name:n};delete state.playlists[name];save('playlists',state.playlists);closeModal();renderPlaylists()}},0)}
async function radioCurrent(){if(!state.current)return;toast('Preparando rádio...');try{const items=await apiSearch((state.current.channel||state.current.title)+' músicas');state.queue=uniq(items.filter(x=>x.id!==state.current.id)).slice(0,35);renderQueue();toast('Rádio criada a partir desta música')}catch(e){toast(e.message)}}
function setTimer(){modal('Temporizador','<p>Escolha quando o ZUPLAY deve pausar a reprodução.</p>','<button class="btn" data-timer="15">15 min</button><button class="btn" data-timer="30">30 min</button><button class="btn primary" data-timer="60">60 min</button>')}
function shareCurrent(){if(!state.current)return;const url='https://www.youtube.com/watch?v='+state.current.id;const data={title:state.current.title,text:state.current.title+' — '+(state.current.channel||'ZUPLAY'),url};if(navigator.share)navigator.share(data).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>toast('Link copiado'))}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-play],[data-expand-player]');if(!b)return;const d=b.dataset;
 if(d.page)return page(d.page);if(d.play)return play(getVideo(d.play));if(d.genre)return searchGenre(d.genre);if(d.fav)return fav(getVideo(d.fav));
 if(d.expandPlayer!==undefined)return showPlayer();if(d.openlist)return openPlaylist(d.openlist);if(d.playlistMenu)return playlistMenu(d.playlistMenu);
 if(d.playPlaylist){const p=state.playlists[d.playPlaylist];if(p?.items.length){state.queue=[...p.items.slice(1)];play(p.items[0],p.items)}return}
 if(d.renamePlaylist)return renamePlaylist(d.renamePlaylist);if(d.closeModal!==undefined)return closeModal();
 if(d.qup!==undefined){const i=+d.qup;if(i>0)[state.queue[i-1],state.queue[i]]=[state.queue[i],state.queue[i-1]];return renderQueue()}
 if(d.qdown!==undefined){const i=+d.qdown;if(i<state.queue.length-1)[state.queue[i+1],state.queue[i]]=[state.queue[i],state.queue[i+1]];return renderQueue()}
 if(d.qremove!==undefined){state.queue.splice(+d.qremove,1);return renderQueue()}
 if(d.timer){clearTimeout(state.timer);state.timer=setTimeout(()=>state.player?.pauseVideo(),+d.timer*60000);closeModal();return toast('Timer definido para '+d.timer+' minutos')}
});
$('#closePlayer').onclick=minimizePlayer;$('#miniToggle').onclick=togglePlayback;$('#miniNext').onclick=next;$('#mainToggle').onclick=togglePlayback;$('#nextBtn').onclick=next;$('#prevBtn').onclick=previous;
$('#favoriteCurrent').onclick=()=>fav(state.current);$('#shuffleBtn').onclick=()=>{state.shuffle=!state.shuffle;save('shuffle',state.shuffle);if(state.shuffle)state.queue.sort(()=>Math.random()-.5);updatePlayerMeta();renderQueue();toast(state.shuffle?'Aleatório ativado':'Aleatório desativado')};
$('#repeatBtn').onclick=()=>{state.repeat=state.repeat==='off'?'all':state.repeat==='all'?'one':'off';save('repeat',state.repeat);updatePlayerMeta();toast(state.repeat==='off'?'Repetição desligada':state.repeat==='all'?'Repetir fila':'Repetir música')};
$('#queueBtn').onclick=()=>$('#queuePanel').classList.toggle('hidden');$('#timerBtn').onclick=setTimer;$('#shareBtn').onclick=shareCurrent;$('#radioBtn').onclick=radioCurrent;$('#playerMenu').onclick=()=>addToPlaylist(state.current);
$('#seek').addEventListener('input',()=>{const d=state.player?.getDuration?.()||0;if(d)state.player.seekTo(d*($('#seek').value/1000),true)});
$('#accountBtn').onclick=accountModal;
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;$('#installBtn').hidden=false});window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;deferredInstallPrompt=null});
$('#installBtn').onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;$('#installBtn').hidden=true}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
const startPage=new URLSearchParams(location.search).get('page');page(['home','explore','all','favorites','playlists','history'].includes(startPage)?startPage:'home');ensureHome();initAuth();
</script>
</body></html>
