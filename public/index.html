const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);

function trackTaste(v){const g=genreOf(v);taste[g]=(taste[g]||0)+1;save('taste',taste)}
const discoveryTerms={sertanejo:['sertanejo mais tocadas 2026','sertanejo universitário sucessos'],funk:['funk brasileiro hits 2026','funk mais tocadas'],gospel:['gospel louvores mais ouvidos','gospel sucessos'],pagode:['pagode mais tocadas','samba pagode sucessos'],forro:['forró piseiro sucessos','forró mais tocadas'],rock:['rock clássicos mais tocados','rock internacional sucessos'],pop:['pop hits 2026','pop internacional sucessos'],eletronica:['eletrônica hits 2026','eletrônica mais tocadas'],rap:['rap trap brasil sucessos','rap nacional mais tocadas'],outros:['músicas mais tocadas brasil 2026','hits do momento brasil 2026','sertanejo mais tocadas','pagode sucessos','pop hits 2026','funk brasileiro hits']};
function pickDiscoveryTerm(){const favorites=Object.entries(taste).filter(([g,n])=>g!=='outros'&&n>0).sort((a,b)=>b[1]-a[1]);const prefer=favorites.length&&Math.random()<.75?favorites[Math.floor(Math.random()*Math.min(2,favorites.length))][0]:'outros';const options=discoveryTerms[prefer]||discoveryTerms.outros;return options[Math.floor(Math.random()*options.length)]}
let discoveryRequest=0;async function loadDiscovery(force=false){if(state.recommendations.length&&!force){renderVideos(state.recommendations);return}const request=++discoveryRequest;$('#message').classList.remove('hidden');$('#message').textContent='Preparando sugestões para você...';$('#results').innerHTML='';try{const term=pickDiscoveryTerm();const response=await fetch('/api/search?q='+encodeURIComponent(term));if(!response.ok)throw Error('Não foi possível carregar sugestões');const data=await response.json();if(request!==discoveryRequest)return;state.recommendations=(data.items||[]).sort(()=>Math.random()-.5);if(state.page==='home')renderVideos(state.recommendations);if(!state.recommendations.length)$('#message').textContent='Nenhuma sugestão encontrada. Use a busca para descobrir músicas.'}catch(e){if(state.page==='home'){$('#message').classList.remove('hidden');$('#message').textContent='Não foi possível carregar sugestões agora. Tente novamente.'}}}
function play(v){if(!v)return;state.current=v;trackTaste(v);updateMediaSession(v);$('#miniTitle').textContent=v.title;$('#miniChannel').textContent=v.channel||'YouTube';$('#miniArt').style.backgroundImage=v.thumbnail?'url('+JSON.stringify(v.thumbnail)+')':'';$('#player').classList.add('visible');$('#playingTitle').textContent=v.title;$('#playingChannel').textContent=v.channel||'YouTube';if(state.queue.length===0){const source=state.results.some(x=>x.id===v.id)?state.results:state.recommendations;const i=source.findIndex(x=>x.id===v.id);if(i>=0)state.queue=[...source.slice(i+1),...source.slice(0,i)].filter(x=>x.id!==v.id)}state.history=[v,...state.history.filter(x=>x.id!==v.id)].slice(0,100);save('history',state.history);if(state.player?.loadVideoById)state.player.loadVideoById(v.id);else if(window.YT?.Player){createPlayer(v.id)}else{window.pendingVideoId=v.id;toast('Preparando o player do YouTube...')}renderQueue();window.scrollTo({top:0,behavior:'smooth'})}
function next(){const v=state.queue.shift();if(v){play(v)}else toast('Fim da fila');renderQueue()}
function updateMediaSession(v){if(!('mediaSession' in navigator)||!v)return;try{navigator.mediaSession.metadata=new MediaMetadata({title:v.title,artist:v.channel||'YouTube',album:'ZUPLAY',artwork:v.thumbnail?[{src:v.thumbnail,sizes:'320x180'}]:[]});navigator.mediaSession.setActionHandler('play',()=>state.player?.playVideo());navigator.mediaSession.setActionHandler('pause',()=>state.player?.pauseVideo());navigator.mediaSession.setActionHandler('nexttrack',()=>next());navigator.mediaSession.setActionHandler('previoustrack',()=>previous())}catch(e){console.info('Media Session indisponível',e)}}
function syncPlayState(playing){if('mediaSession' in navigator)try{navigator.mediaSession.playbackState=playing?'playing':'paused'}catch(e){}$('#playGlyph').textContent=playing?'⏸':'▶';$('#playLabel').textContent=playing?'Pausar':'Reproduzir';$('#miniToggle').textContent=playing?'⏸':'▶'}
function togglePlayback(){if(!state.player)return;const p=state.player;if(p.getPlayerState()===YT.PlayerState.PLAYING)p.pauseVideo();else p.playVideo()}
function minimize(){if(!state.current)return;$('#player').classList.remove('visible');$('#player').classList.add('compact');$('#miniPlayer').classList.remove('hidden');document.body.classList.add('has-mini')}
function expand(){if(!state.current)return;$('#miniPlayer').classList.add('hidden');$('#player').classList.remove('compact');$('#player').classList.add('visible');document.body.classList.remove('has-mini');$('#player').scrollIntoView({behavior:'smooth',block:'start'})}
function previous(){const i=state.history.findIndex(v=>v.id===state.current?.id);const prev=state.history[i+1];if(prev){if(state.current)state.queue.unshift(state.current);play(prev)}else toast('Nenhuma música anterior no histórico')}
function createPlayer(id){state.player=new YT.Player('youtubeFrame',{videoId:id,playerVars:{playsinline:1,rel:0,autoplay:1,origin:location.origin},events:{onReady:e=>e.target.playVideo(),onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next();if(e.data===YT.PlayerState.PLAYING)syncPlayState(true);if(e.data===YT.PlayerState.PAUSED)syncPlayState(false)},onError:e=>{toast('Vídeo indisponível ('+e.data+'). Pulando...');setTimeout(next,1000)}}})}
window.onYouTubeIframeAPIReady=()=>{if(window.pendingVideoId){createPlayer(window.pendingVideoId);window.pendingVideoId=null}};
function renderQueue(){$('#queue').innerHTML=state.queue.length?state.queue.map((v,i)=>'<div class="queue-item"><span>'+esc(v.title)+'</span><button data-removequeue="'+i+'">✕</button></div>').join(''):'<p style="color:#999">Sua fila está vazia.</p>'}
function toggleFav(v){if(!v)return;state.favorites=state.favorites.some(x=>x.id===v.id)?state.favorites.filter(x=>x.id!==v.id):[v,...state.favorites];save('favorites',state.favorites);toast(state.favorites.some(x=>x.id===v.id)?'Adicionado aos favoritos':'Removido dos favoritos');if(state.page==='favorites')renderVideos(state.favorites);else if(state.page==='search')renderVideos(state.results)}
function modal(title,content,actions){$('#modalHost').innerHTML='<div class="modal-back"><div class="modal"><h2>'+esc(title)+'</h2>'+content+'<footer><button class="mini" id="closeModal">Cancelar</button>'+actions+'</footer></div></div>';$('#closeModal').onclick=closeModal}
function closeModal(){$('#modalHost').innerHTML=''}
function addToPlaylist(v){if(!v)return;const names=Object.keys(state.playlists);modal('Adicionar à playlist','<select id="playlistSelect" style="width:100%;padding:12px;background:#0b0b14;color:white;border:1px solid #51436a;border-radius:9px">'+names.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select><p style="color:#a1a1aa">Você também pode criar uma nova playlist na Biblioteca.</p>','<button class="cta" id="confirmAdd">Adicionar</button>');$('#confirmAdd').onclick=()=>{const name=$('#playlistSelect')?.value;if(!name)return toast('Crie uma playlist primeiro');if(!state.playlists[name].some(x=>x.id===v.id))state.playlists[name].push(v);save('playlists',state.playlists);closeModal();toast('Adicionado à playlist '+name)}}
function createPlaylist(){modal('Nova playlist','<input id="newName" maxlength="50" placeholder="Nome da playlist" autocomplete="off">','<button class="cta" id="confirmCreate">Criar</button>');$('#confirmCreate').onclick=()=>{const n=$('#newName').value.trim();if(!n)return toast('Digite um nome');if(state.playlists[n])return toast('Já existe uma playlist com esse nome');state.playlists[n]=[];save('playlists',state.playlists);closeModal();page('playlists');toast('Playlist criada')}}
function renderLists(){const names=Object.keys(state.playlists);$('#results').classList.add('hidden');$('#lists').classList.remove('hidden');$('#message').classList.toggle('hidden',names.length>0);$('#message').textContent='Crie sua primeira playlist para organizar suas músicas.';$('#lists').innerHTML=names.map(n=>'<div class="playlist-row"><div><strong>▤ '+esc(n)+'</strong><small>'+state.playlists[n].length+' vídeos</small></div><div><button class="mini" data-openlist="'+esc(n)+'">Abrir</button> <button class="mini" data-deletelist="'+esc(n)+'">Excluir</button></div></div>').join('')}
function page(p){if(state.current&&p!=='home')minimize();state.page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#hero').classList.toggle('hidden',p!=='home');$('#createList').classList.toggle('hidden',p!=='playlists');$('#sectionTitle').textContent=({home:'Descubra sua próxima favorita',all:'Todas as músicas',search:'Resultados da pesquisa',playlists:'Suas playlists',favorites:'Vídeos favoritos',history:'Assistidos recentemente'})[p]||'Vídeos';if(p==='playlists')renderLists();else if(p==='favorites')renderVideos(state.favorites);else if(p==='history')renderVideos(state.history);else if(p==='search')renderVideos(state.results);else if(p==='all')renderVideos([...state.recommendations,...state.results].filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i));else loadDiscovery()}
async function search(q){if(state.current)minimize();page('search');$('#message').classList.remove('hidden');$('#message').textContent='Buscando vídeos...';$('#results').innerHTML='';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw Error(data.error||'Erro ao buscar');state.results=data.items||[];renderVideos(state.results)}catch(e){$('#message').classList.remove('hidden');$('#message').textContent=e.message;toast(e.message)}}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;$('#installBtn').hidden=false});
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;deferredInstallPrompt=null});
$('#installBtn').onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;$('#installBtn').hidden=true}else toast('No navegador, use o menu e selecione Instalar aplicativo ou Adicionar à tela inicial.')};
$('#searchForm').onsubmit=e=>{e.preventDefault();search($('#query').value.trim())};
$('#exploreBtn').onclick=()=>{$('#query').focus();page('search')};
$('#createList').onclick=createPlaylist;
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-play],[data-fav],[data-add],[data-queue],[data-removequeue],[data-openlist],[data-deletelist]');if(!b)return;const d=b.dataset;if(d.page)return page(d.page);if(d.play)return play(getVideo(d.play));if(d.fav)return toggleFav(getVideo(d.fav));if(d.add)return addToPlaylist(getVideo(d.add));if(d.queue){const v=getVideo(d.queue);if(v){state.queue.push(v);renderQueue();toast('Adicionado à fila')}return}if(d.removequeue!==undefined){state.queue.splice(Number(d.removequeue),1);return renderQueue()}if(d.openlist){$('#sectionTitle').textContent=d.openlist;renderVideos(state.playlists[d.openlist]||[]);return}if(d.deletelist){if(confirm('Excluir a playlist '+d.deletelist+'?')){delete state.playlists[d.deletelist];save('playlists',state.playlists);renderLists()}return}});
$('#next').onclick=next;$('#prev').onclick=previous;$('#togglePlayback').onclick=togglePlayback;$('#minimizePlayer').onclick=minimize;$('#expandPlayer').onclick=expand;$('#miniToggle').onclick=togglePlayback;$('#miniNext').onclick=next;$('#miniPrev').onclick=previous;$('#favoriteCurrent').onclick=()=>toggleFav(state.current);$('#addCurrent').onclick=()=>addToPlaylist(state.current);
$('#screen').innerHTML='<div id="youtubeFrame" style="width:100%;height:100%"></div>';
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
page('home');
</script></body></html>
