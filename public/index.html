<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b14"><meta name="description" content="ZUPLAY — vídeos, músicas e suas playlists"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>ZUPLAY — Vídeos e músicas</title>
<style>
:root{font-family:Inter,Montserrat,system-ui,-apple-system,Arial,sans-serif;color:#f6f5ff;background:#0b0b14;--violet:#8b5cf6;--cyan:#22d3ee;--muted:#a1a1aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% -15%,#261047 0,transparent 42%),#0b0b14}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.app{max-width:1420px;margin:auto;display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid #ffffff12;padding:29px 18px;position:sticky;top:0;height:100vh;background:#0b0b14dd}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:white;font-size:25px;font-weight:900;letter-spacing:-1.4px}.brand img{width:42px;height:42px}.brand span span{color:var(--cyan)}.side-title{font-size:11px;letter-spacing:2px;color:#8c89a7;margin:38px 14px 14px}.navbtn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#a4a0bc;padding:13px 15px;width:100%;border-radius:13px;text-align:left;margin:4px 0}.navbtn.active,.navbtn:hover{background:linear-gradient(90deg,#7b2df1,#5420a6);color:#fff}.navbtn b{font-size:20px;font-weight:500}.main{min-width:0;padding:24px 38px 120px}.topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:25px}.search{flex:1;display:flex;align-items:center;background:#191725;border:1px solid #343044;border-radius:24px;overflow:hidden;max-width:600px}.search input{flex:1;min-width:0;padding:14px 18px;background:none;border:0;color:#fff;outline:none}.search button{border:0;background:var(--violet);color:white;padding:14px 20px}.profile{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#9a4cff,#24c9e9);font-weight:800}.hero{position:relative;min-height:272px;overflow:hidden;border-radius:22px;background:linear-gradient(90deg,#1d1045 0%,#29135bd9 42%,#0c173c8c 100%),radial-gradient(circle at 76% 55%,#d02da8 0,transparent 40%);padding:44px;display:flex;align-items:center;box-shadow:0 14px 65px #0005}.hero:after{content:'♫';position:absolute;font-size:290px;right:10%;top:-45px;color:#ffffff16;transform:rotate(-16deg)}.hero h1{font-size:clamp(28px,4vw,52px);line-height:1.05;margin:8px 0}.hero p{color:#c9bfe6;max-width:370px}.pill{display:inline-block;background:#8137eb;padding:7px 15px;border-radius:50px;font-size:12px;font-weight:700}.cta{border:0;background:linear-gradient(115deg,#8b5cf6,#b04aff);border-radius:100px;color:#fff;font-weight:800;padding:12px 22px;margin-top:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:34px 0 15px}.section-head h2{font-size:21px;letter-spacing:-.6px;margin:0}.section-head button{border:0;background:none;color:#a99bc5}.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.video{min-width:0;cursor:pointer}.thumb{aspect-ratio:16/9;background:#1b1930;border-radius:14px;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.thumb .play{position:absolute;bottom:10px;right:10px;background:#0b0b14d9;border-radius:50%;padding:8px 11px}.video h3{font-size:14px;line-height:1.4;margin:10px 0 5px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.video p{color:var(--muted);font-size:12px;margin:0}.video-actions{display:flex;gap:8px;margin-top:8px}.mini{border:1px solid #37324c;background:#191628;color:#ddd5fa;border-radius:9px;padding:7px 10px;font-size:12px}.mini:hover{border-color:var(--violet)}.player-shell{display:none;background:#11101d;border:1px solid #3d315d;border-radius:20px;overflow:hidden;margin-bottom:25px}.player-shell.visible{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr)}.screen{aspect-ratio:16/9;background:black;position:relative}.screen iframe{width:100%;height:100%;border:0}.player-info{padding:22px;min-width:0}.player-info h2{font-size:19px;margin:0 0 12px}.player-info p{color:#aaa4c1;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.queue{max-height:200px;overflow:auto;margin-top:12px}.queue-item{display:flex;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #ffffff12;color:#ccc;font-size:12px}.queue-item span{flex:1}.queue-item button{border:0;background:transparent;color:#d5c2ff}.empty{padding:28px;border:1px dashed #3d3654;border-radius:14px;color:#a7a0bb;text-align:center}.playlist-row{display:flex;justify-content:space-between;align-items:center;background:#171525;border:1px solid #2c2840;padding:16px;border-radius:12px;margin-bottom:10px;gap:12px}.playlist-row div{min-width:0}.playlist-row strong{display:block}.playlist-row small{color:var(--muted)}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#362258;color:#fff;padding:13px 20px;border-radius:12px;box-shadow:0 6px 40px #000a;display:none;z-index:30;max-width:90vw}.bottom{display:none}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#000b;z-index:40;display:grid;place-items:center;padding:18px}.modal{width:min(420px,100%);background:#1a1629;padding:24px;border-radius:20px;border:1px solid #574579}.modal input{width:100%;background:#0d0c16;border:1px solid #50445f;color:white;padding:13px;border-radius:9px;margin:14px 0}.modal footer{display:flex;justify-content:flex-end;gap:9px}@media(max-width:950px){.app{grid-template-columns:75px minmax(0,1fr)}.sidebar{padding:25px 10px}.brand span,.side-title,.navbtn span{display:none}.navbtn{justify-content:center}.main{padding:20px 20px 100px}.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-shell.visible{grid-template-columns:1fr}}@media(max-width:600px){.app{display:block}.sidebar{display:none}.main{padding:18px 14px 100px}.topbar{gap:10px}.search input{padding:12px}.search button{padding:12px}.hero{min-height:210px;padding:24px}.hero h1{font-size:34px}.hero:after{right:0;font-size:180px;top:20px}.video-grid{gap:12px}.section-head h2{font-size:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0d0b19f5;backdrop-filter:blur(18px);display:flex;justify-content:space-around;padding:11px 6px calc(11px + env(safe-area-inset-bottom));border-top:1px solid #332847;z-index:20}.bottom button{background:none;border:0;color:#aaa3c1;font-size:11px;display:grid;gap:5px;place-items:center}.bottom button.active{color:#b584ff}.bottom b{font-size:22px;font-weight:400}.player-info{padding:16px}.hero p{font-size:13px}}
</style></head>
<body><div class="app"><aside class="sidebar"><a href="/" class="brand"><img src="/icon.svg" alt=""><span>ZU<span>PLAY</span></span></a><div class="side-title">SUA BIBLIOTECA</div><button class="navbtn active" data-page="home"><b>⌂</b><span>Início</span></button><button class="navbtn" data-page="search"><b>⌕</b><span>Explorar</span></button><button class="navbtn" data-page="playlists"><b>▤</b><span>Playlists</span></button><button class="navbtn" data-page="favorites"><b>♡</b><span>Favoritos</span></button><button class="navbtn" data-page="history"><b>◷</b><span>Histórico</span></button></aside>
<main class="main"><header class="topbar"><form id="searchForm" class="search"><input id="query" aria-label="Buscar vídeos" placeholder="Buscar músicas, artistas, vídeos..." required><button type="submit">⌕ Buscar</button></form><div class="profile">Z</div></header>
<section id="player" class="player-shell"><div class="screen" id="screen"></div><div class="player-info"><h2 id="playingTitle">Reproduzindo</h2><p id="playingChannel"></p><div class="controls"><button class="mini" id="prev">⏮ Anterior</button><button class="mini" id="next">Próximo ⏭</button><button class="mini" id="favoriteCurrent">♡ Favoritar</button><button class="mini" id="addCurrent">＋ Playlist</button></div><h3>Próximos na fila</h3><div class="queue" id="queue"></div></div></section>
<section id="hero" class="hero"><div><span class="pill">✦ BEM-VINDO AO ZUPLAY</span><h1>Curta<br>sem limites.</h1><p>Seus vídeos, suas músicas, suas playlists. Tudo em um só lugar.</p><button class="cta" id="exploreBtn">Explorar músicas ▶</button></div></section>
<section id="content"><div class="section-head"><h2 id="sectionTitle">Descubra sua próxima favorita</h2><button id="createList" class="hidden">＋ Nova playlist</button></div><div id="results" class="video-grid"></div><div id="lists" class="hidden"></div><div id="message" class="empty">Pesquise um artista ou uma música para começar a explorar.</div></section></main></div>
<nav class="bottom"><button data-page="home" class="active"><b>⌂</b>Início</button><button data-page="search"><b>⌕</b>Explorar</button><button data-page="playlists"><b>▤</b>Biblioteca</button><button data-page="favorites"><b>♡</b>Favoritos</button></nav><div class="toast" id="toast"></div><div id="modalHost"></div>
<script src="https://www.youtube.com/iframe_api"></script><script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem('zuplay-'+key))||fallback}catch{return fallback}};
const state={favorites:load('favorites',[]),playlists:load('playlists',{}),history:load('history',[]),queue:[],current:null,results:[],page:'home',player:null};
const save=(key,value)=>localStorage.setItem('zuplay-'+key,JSON.stringify(value));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3200)}
function card(v){return '<article class="video"><div class="thumb" data-play="'+esc(v.id)+'"><img src="'+esc(v.thumbnail||'https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/mqdefault.jpg')+'" alt="" loading="lazy"><span class="play">▶</span></div><h3>'+esc(v.title)+'</h3><p>'+esc(v.channel||'YouTube')+'</p><div class="video-actions"><button class="mini" data-fav="'+esc(v.id)+'">'+(state.favorites.some(x=>x.id===v.id)?'♥':'♡')+'</button><button class="mini" data-add="'+esc(v.id)+'">＋ Playlist</button><button class="mini" data-queue="'+esc(v.id)+'">＋ Fila</button></div></article>'}
function renderVideos(items){$('#lists').classList.add('hidden');$('#results').classList.remove('hidden');$('#results').innerHTML=items.map(card).join('');$('#message').classList.toggle('hidden',items.length>0);if(!items.length)$('#message').textContent='Nenhum vídeo encontrado nesta seção.'}
function getVideo(id){return [...state.results,...state.favorites,...state.history,...state.queue,...Object.values(state.playlists).flat(),...(state.current?[state.current]:[])].find(x=>x.id===id)}
function play(v){if(!v)return;state.current=v;$('#player').classList.add('visible');$('#playingTitle').textContent=v.title;$('#playingChannel').textContent=v.channel||'YouTube';state.history=[v,...state.history.filter(x=>x.id!==v.id)].slice(0,100);save('history',state.history);if(state.player?.loadVideoById)state.player.loadVideoById(v.id);else if(window.YT?.Player){state.player=new YT.Player('youtubeFrame',{videoId:v.id,playerVars:{playsinline:1,rel:0},events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next()},onError:()=>toast('Este vídeo não está disponível para incorporação.')}})}else toast('Carregando o player do YouTube...');renderQueue();window.scrollTo({top:0,behavior:'smooth'})}
function next(){const v=state.queue.shift();if(v){play(v)}else toast('Fim da fila');renderQueue()}
function renderQueue(){$('#queue').innerHTML=state.queue.length?state.queue.map((v,i)=>'<div class="queue-item"><span>'+esc(v.title)+'</span><button data-removequeue="'+i+'">✕</button></div>').join(''):'<p style="color:#999">Sua fila está vazia.</p>'}
function toggleFav(v){if(!v)return;state.favorites=state.favorites.some(x=>x.id===v.id)?state.favorites.filter(x=>x.id!==v.id):[v,...state.favorites];save('favorites',state.favorites);toast(state.favorites.some(x=>x.id===v.id)?'Adicionado aos favoritos':'Removido dos favoritos');if(state.page==='favorites')renderVideos(state.favorites);else if(state.page==='search')renderVideos(state.results)}
function modal(title,content,actions){$('#modalHost').innerHTML='<div class="modal-back"><div class="modal"><h2>'+esc(title)+'</h2>'+content+'<footer><button class="mini" id="closeModal">Cancelar</button>'+actions+'</footer></div></div>';$('#closeModal').onclick=closeModal}
function closeModal(){$('#modalHost').innerHTML=''}
function addToPlaylist(v){if(!v)return;const names=Object.keys(state.playlists);modal('Adicionar à playlist','<select id="playlistSelect" style="width:100%;padding:12px;background:#0b0b14;color:white;border:1px solid #51436a;border-radius:9px">'+names.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select><p style="color:#a1a1aa">Você também pode criar uma nova playlist na Biblioteca.</p>','<button class="cta" id="confirmAdd">Adicionar</button>');$('#confirmAdd').onclick=()=>{const name=$('#playlistSelect')?.value;if(!name)return toast('Crie uma playlist primeiro');if(!state.playlists[name].some(x=>x.id===v.id))state.playlists[name].push(v);save('playlists',state.playlists);closeModal();toast('Adicionado à playlist '+name)}}
function createPlaylist(){modal('Nova playlist','<input id="newName" maxlength="50" placeholder="Nome da playlist" autocomplete="off">','<button class="cta" id="confirmCreate">Criar</button>');$('#confirmCreate').onclick=()=>{const n=$('#newName').value.trim();if(!n)return toast('Digite um nome');if(state.playlists[n])return toast('Já existe uma playlist com esse nome');state.playlists[n]=[];save('playlists',state.playlists);closeModal();page('playlists');toast('Playlist criada')}}
function renderLists(){const names=Object.keys(state.playlists);$('#results').classList.add('hidden');$('#lists').classList.remove('hidden');$('#message').classList.toggle('hidden',names.length>0);$('#message').textContent='Crie sua primeira playlist para organizar suas músicas.';$('#lists').innerHTML=names.map(n=>'<div class="playlist-row"><div><strong>▤ '+esc(n)+'</strong><small>'+state.playlists[n].length+' vídeos</small></div><div><button class="mini" data-openlist="'+esc(n)+'">Abrir</button> <button class="mini" data-deletelist="'+esc(n)+'">Excluir</button></div></div>').join('')}
function page(p){state.page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#hero').classList.toggle('hidden',p!=='home');$('#createList').classList.toggle('hidden',p!=='playlists');$('#sectionTitle').textContent=({home:'Descubra sua próxima favorita',search:'Resultados da pesquisa',playlists:'Suas playlists',favorites:'Vídeos favoritos',history:'Assistidos recentemente'})[p]||'Vídeos';if(p==='playlists')renderLists();else if(p==='favorites')renderVideos(state.favorites);else if(p==='history')renderVideos(state.history);else if(p==='search')renderVideos(state.results);else renderVideos(state.results)}
async function search(q){page('search');$('#message').classList.remove('hidden');$('#message').textContent='Buscando vídeos...';$('#results').innerHTML='';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw Error(data.error||'Erro ao buscar');state.results=data.items||[];renderVideos(state.results)}catch(e){$('#message').classList.remove('hidden');$('#message').textContent=e.message;toast(e.message)}}
$('#searchForm').onsubmit=e=>{e.preventDefault();search($('#query').value.trim())};
$('#exploreBtn').onclick=()=>{$('#query').focus();page('search')};
$('#createList').onclick=createPlaylist;
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-play],[data-fav],[data-add],[data-queue],[data-removequeue],[data-openlist],[data-deletelist]');if(!b)return;const d=b.dataset;if(d.page)return page(d.page);if(d.play)return play(getVideo(d.play));if(d.fav)return toggleFav(getVideo(d.fav));if(d.add)return addToPlaylist(getVideo(d.add));if(d.queue){const v=getVideo(d.queue);if(v){state.queue.push(v);renderQueue();toast('Adicionado à fila')}return}if(d.removequeue!==undefined){state.queue.splice(Number(d.removequeue),1);return renderQueue()}if(d.openlist){$('#sectionTitle').textContent=d.openlist;renderVideos(state.playlists[d.openlist]||[]);return}if(d.deletelist){if(confirm('Excluir a playlist '+d.deletelist+'?')){delete state.playlists[d.deletelist];save('playlists',state.playlists);renderLists()}return}});
$('#next').onclick=next;$('#prev').onclick=()=>toast('Use a fila para escolher o vídeo anterior');$('#favoriteCurrent').onclick=()=>toggleFav(state.current);$('#addCurrent').onclick=()=>addToPlaylist(state.current);
$('#screen').innerHTML='<div id="youtubeFrame" style="width:100%;height:100%"></div>';
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
page('home');
</script></body></html>
